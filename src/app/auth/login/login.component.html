<div class="auth-bg min-h-screen flex flex-col items-center justify-center px-5 py-14">

  <!-- Logo -->
  <a routerLink="/" class="anim-logo mb-14 flex flex-col items-center gap-1 select-none">
    <div class="text-[28px] font-black tracking-tight leading-none">
      <span class="text-white italic">RUTA</span><span class="text-[#E31C1C] italic">SPORT</span>
    </div>
    <div class="text-[8px] font-black tracking-[.45em] text-white/25 uppercase">Performance</div>
  </a>

  <div class="w-full max-w-[400px]">

    <!-- Eyebrow + title -->
    <div class="anim-label mb-1">
      <span class="text-[10px] font-black tracking-[.3em] text-[#E31C1C]/60 uppercase">01 — Acceso</span>
    </div>
    <h1 class="anim-title text-[3.2rem] font-black text-white tracking-tight leading-[.95] mb-10">
      Iniciar<br>sesión
    </h1>

    <!-- Error -->
    @if (error()) {
      <div [class.error-shake]="shaking()"
           class="mb-7 flex items-center gap-2.5 text-[#ff5050] text-sm">
        <div class="w-1 h-5 bg-[#E31C1C] rounded-full shrink-0"></div>
        {{ error() }}
      </div>
    }

    <form (ngSubmit)="submit()" novalidate>

      <!-- Email -->
      <div class="anim-f1 fl-group mb-8">
        <input class="fl-input" type="email" [(ngModel)]="email" name="email"
               placeholder=" " autocomplete="email"/>
        <label class="fl-label">Correo electrónico</label>
        <div class="fl-bar"></div>
      </div>

      <!-- Password -->
      <div class="anim-f2 fl-group mb-10">
        <input class="fl-input" [type]="showPassword() ? 'text' : 'password'"
               [(ngModel)]="password" name="password"
               placeholder=" " autocomplete="current-password"/>
        <label class="fl-label">Contraseña</label>
        <div class="fl-bar"></div>
        <button type="button" class="eye-btn" (click)="showPassword.set(!showPassword())">
          @if (showPassword()) {
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
            </svg>
          } @else {
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
            </svg>
          }
        </button>
      </div>

      <!-- CTA -->
      <div class="anim-f3">
        <button type="submit" class="cta-btn" [disabled]="loading()">
          @if (loading()) {
            <span class="flex items-center justify-center gap-3">
              <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
              </svg>
              Ingresando
            </span>
          } @else {
            Entrar
          }
        </button>
      </div>

    </form>

    <!-- Footer links -->
    <div class="anim-footer mt-9 flex flex-col items-center gap-4">
      <div class="auth-divider w-full"></div>
      <p class="text-white/30 text-sm">
        ¿No tienes cuenta?
        <a routerLink="/registro"
           class="text-white font-black hover:text-[#E31C1C] transition-colors ml-1.5">
          Crear cuenta →
        </a>
      </p>
      <a routerLink="/" class="text-white/18 hover:text-white/45 text-xs transition-colors tracking-wider">
        ← Volver a la tienda
      </a>
    </div>

  </div>
</div>
